<header class="shell__bar wv-print-hide">
  <a class="shell__brand" routerLink="/home"><app-brand-mark /></a>

  <nav class="shell__nav">
    <a routerLink="/home" routerLinkActive="is-active">{{ text().app.home }}</a>
    <a *appHasPermission="'Post.View'" routerLink="/feed" routerLinkActive="is-active">{{
      text().app.feed
    }}</a>
    <a
      *appHasPermission="'Employee.View'"
      routerLink="/employees"
      routerLinkActive="is-active"
      >{{ text().app.directory }}</a
    >
    <a routerLink="/profile" routerLinkActive="is-active">{{ text().app.myProfile }}</a>
    <a routerLink="/public" routerLinkActive="is-active">{{ text().app.public }}</a>
  </nav>

  <div class="shell__account">
    <app-language-toggle />
    @if (user(); as current) {
      <span class="shell__who" dir="auto">{{ current.displayName ?? current.userName }}</span>
    }
    <button type="button" class="wv-btn wv-btn--quiet wv-btn--sm" (click)="signOut()">
      {{ text().app.signOut }}
    </button>
  </div>
</header>

<main class="shell__body">
  <router-outlet />
</main>
