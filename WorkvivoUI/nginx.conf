server {
    # 8080, not 80: nginx runs unprivileged in the container and cannot bind a
    # port below 1024.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the version. Free, and it removes one hint about which
    # known vulnerabilities are worth trying.
    server_tokens off;

    # The API is reached through the same origin, so the browser sends no
    # preflight and the refresh cookie's Path and SameSite rules hold. The
    # upstream name is the compose service.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SignalR hub needs the upgrade headers, and a timeout long enough that an
    # idle connection is not cut every minute.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed filenames, so these can be cached hard and forever.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html is never cached. It names the hashed bundles, so a stale copy
    # pins a browser to a deployment that no longer exists.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
